<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>有序 · 登录</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="cloud.css?v=auth49"></head>
<body class="auth-page"><main id="auth-root" class="auth-card"><div class="auth-brand"><div class="auth-mark">序</div><div><strong>有序</strong><small>PERSONAL WORKSPACE</small></div></div><div class="auth-intro"><div class="auth-kicker">YOUR DAILY SPACE</div><h1>把生活，放在一个清晰的地方</h1><p>任务、学习、财务与健康记录，按自己的节奏慢慢积累。</p></div><div class="auth-flow"><span class="flow-step active">1　选择入口</span><i></i><span class="flow-step">2　验证邮箱</span><i></i><span class="flow-step">3　进入工作台</span></div><div class="auth-tabs"><button id="login-tab" aria-pressed="true">登录</button><button id="register-tab" aria-pressed="false">注册新账号</button></div><div class="auth-section-label">登录方式</div><div class="auth-tabs" id="method-tabs"><button id="otp-tab" aria-pressed="true">邮箱验证码</button><button id="password-tab" aria-pressed="false">邮箱密码</button></div><form id="auth-form"><label for="email">邮箱地址</label><input id="email" type="email" autocomplete="email" placeholder="请输入常用邮箱" required maxlength="254"><div id="password-fields" hidden><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" maxlength="128" placeholder="请输入密码"></div><div id="confirm-fields" hidden><label for="password-confirm">确认新密码</label><input id="password-confirm" type="password" autocomplete="new-password" maxlength="128" placeholder="再次输入新密码"></div><div class="code-row" id="code-fields"><div><label for="otp">邮箱验证码</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6 位数字"></div><button type="button" id="send-code" disabled>获取验证码</button></div><button class="primary auth-submit" type="submit" id="verify-code" disabled>登录并进入工作台</button></form><button type="button" class="quiet" id="reset-password">设置密码／忘记密码</button><p id="auth-status" role="status" aria-live="polite">正在连接登录服务…</p><p class="auth-foot">验证码会发送到你的邮箱。注册后会创建一个新的空白工作台。</p><a class="local-entry" href="index.html">只在本机使用，不登录 →</a></main><script type="module" src="cloud-entry.js?v=auth48"></script></body></html>
